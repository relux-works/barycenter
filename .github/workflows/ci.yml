name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Identity rollback compatibility executes the exact pinned
          # pre-identity coordinator source, so its commit must be available.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: coordinator/go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Vet, tests, and pinned previous-coordinator compatibility
        run: |
          cd coordinator
          go vet ./...
          go test ./...
          go test -tags previoushead -count=1 ./internal/store -run '^(TestR8ExactPreviousHEAD(AuthorityRoundTrip|TwoGenerationProjectionComposition|ConfigBootstrapContract)|TestMediaIngestExactPreviousHeadRollback)$'

  node-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: cd node-app && swift test

  # EPIC B blind build: no Windows runner needed — the portable parts (golden
  # round-trip, clock sync, ring, ws client, supervisor, player) test on
  # linux via the !windows audio stub; the Windows-only legs (winio pipe +
  # WASAPI) are gated by the cross-compile.
  pulsar-win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pulsar-win/go.mod
      - name: Unit tests (portable, audio stub)
        run: cd pulsar-win && go vet ./... && go test ./...
      - name: Generate Windows resources (icon + DPI manifest)
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          cd pulsar-win && "$(go env GOPATH)/bin/go-winres" make --in winres/winres.json --arch amd64 --product-version "${GITHUB_REF_NAME:-dev}"
      - name: Cross-compile for Windows (blind-build gate)
        run: cd pulsar-win && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

  pulsar-win-packaged-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pulsar-win/go.mod
      - name: Assert native command failures fail the package job
        shell: pwsh
        run: ./pulsar-win/probe-msix/native-command.Tests.ps1
      - name: Assert frozen package identity and declarations
        shell: pwsh
        run: ./pulsar-win/probe-msix/package-contract.Tests.ps1
      - name: Build native helper, run tests, and create signed MSIX
        shell: pwsh
        run: |
          $thumbprint = & ./pulsar-win/probe-msix/new-test-signing-certificate.ps1 -ValidityDays 30
          try {
            ./pulsar-win/probe-msix/build-probe.ps1 `
              -Version 0.1.0.0 `
              -SigningCertificateThumbprint $thumbprint
          } finally {
            Remove-Item -Force "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
          }
      - name: Assert hardware evidence and cleanup contracts
        shell: pwsh
        run: |
          $package = Get-ChildItem dist/windows-probe/PulsarProbe-*-x64-signed.msix | Select-Object -First 1
          if (-not $package) { throw "signed probe MSIX missing" }
          ./pulsar-win/probe-msix/hardware-evidence.Tests.ps1 -Package $package.FullName
      - name: Verify signed install contract without claiming hardware evidence
        shell: pwsh
        run: |
          $package = Get-ChildItem dist/windows-probe/PulsarProbe-*-x64-signed.msix | Select-Object -First 1
          if (-not $package) { throw "signed probe MSIX missing" }
          $result = $null
          try {
            $result = & ./pulsar-win/probe-msix/install-probe.ps1 `
              -Package $package.FullName `
              -TrustLocalTestSigner
            if ($result.PackageIdentity -cne "ReluxWorksLLC.PulsarBarycenter") {
              throw "installed probe identity mismatch"
            }
            if (-not (Test-Path $result.ReceiptPath)) {
              throw "install contract receipt missing"
            }
            $metadata = Get-Content "$($package.FullName).json" -Raw | ConvertFrom-Json
            $receipt = Get-Content $result.ReceiptPath -Raw | ConvertFrom-Json
            if ($receipt.packageSha256 -cne $metadata.sha256) {
              throw "installed package digest differs from the signed build metadata"
            }
            if ($receipt.schemaVersion -ne 2 -or
                $receipt.signerThumbprint -notmatch '^[0-9a-f]{40}$' -or
                -not $receipt.signerTrustAdded -or
                $receipt.privateSigningMaterialIncluded) {
              throw "install receipt lacks the hardware cleanup provenance contract"
            }
            $pickerFixture = Join-Path $env:RUNNER_TEMP "pulsar-picker-cleanup.bin"
            [IO.File]::WriteAllBytes($pickerFixture, [byte[]](1, 2, 3, 4))
            $unsafeCleanupRejected = $false
            try {
              ./pulsar-win/probe-msix/uninstall-probe.ps1 `
                -ReceiptPath $result.ReceiptPath `
                -PickerFixture $pickerFixture `
                -CleanupReceiptPath (Join-Path $result.RuntimeRoot "unsafe-cleanup.json") `
                -EvidenceCopied | Out-Null
            } catch {
              if ($_.Exception.Message -notmatch "outside the runtime root") { throw }
              $unsafeCleanupRejected = $true
            }
            if (-not $unsafeCleanupRejected -or
                @(Get-AppxPackage -Name "ReluxWorksLLC.PulsarBarycenter").Count -ne 1) {
              throw "unsafe in-runtime cleanup output was not rejected before mutation"
            }
            $cleanupPath = "$($package.FullName).cleanup.json"
            $cleanup = ./pulsar-win/probe-msix/uninstall-probe.ps1 `
              -ReceiptPath $result.ReceiptPath `
              -PickerFixture $pickerFixture `
              -CleanupReceiptPath $cleanupPath `
              -EvidenceCopied
            if (-not $cleanup.processAbsent -or
                -not $cleanup.packageAbsent -or
                -not $cleanup.signerTrustAbsent -or
                -not $cleanup.runtimeRootAbsent -or
                -not $cleanup.hotkeyAvailable -or
                -not $cleanup.pickerFixtureExclusiveAccess -or
                -not $cleanup.pickerFixtureDeleted -or
                $cleanup.remainingPartialCount -ne 0) {
              throw "hardware cleanup receipt did not prove every hosted cleanup postcondition"
            }
          } finally {
            if ($null -ne $result) {
              Remove-AppxPackage -Package $result.PackageFullName -ErrorAction SilentlyContinue
              if ($result.SignerTrustAdded) {
                Remove-Item -Force "Cert:\LocalMachine\TrustedPeople\$($result.SignerThumbprint)" -ErrorAction SilentlyContinue
              }
            }
          }
      - name: Upload reproducible signed probe
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-signed-msix-probe
          path: dist/windows-probe/PulsarProbe-*-x64-signed.msix*
          if-no-files-found: error
          retention-days: 14
