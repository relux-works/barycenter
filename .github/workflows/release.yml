name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  pulsar-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: CFBundleVersion = rev-count (Sparkle ordering)
      - uses: actions/checkout@v4
        with:
          repository: relux-works/go-librespot
          path: fork
      - uses: actions/setup-go@v5
        with:
          go-version-file: fork/go.mod
      - name: Build daemon (fork, reproducible, arm64)
        run: |
          cd fork
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -buildid=" -o ../daemon-arm64 ./cmd/daemon
      # arm64-only for the beta: SwiftPM dual-arch manifests misbehave on
      # runners (given [5], supported []); universal ships later via xcodebuild.
      - name: Build Pulsar (arm64)
        run: |
          cd node-app
          swift build -c release
      - name: Import Developer ID identity
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          echo "$MACOS_CERT_P12" | base64 -d > /tmp/devid.p12
          security create-keychain -p ci-temp ci.keychain
          security set-keychain-settings -lut 21600 ci.keychain
          security unlock-keychain -p ci-temp ci.keychain
          security import /tmp/devid.p12 -k ci.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-temp ci.keychain
          security list-keychains -d user -s ci.keychain login.keychain
          rm /tmp/devid.p12
      - name: Bundle Pulsar.app + dmg
        run: |
          export VERSION="${GITHUB_REF_NAME}"
          export NODEAPP_BIN="$PWD/node-app/.build/release/NodeApp"
          export LIBRESPOT_BIN="$PWD/daemon-arm64"
          export APP_NAME=Pulsar
          export SIGN_CN="Developer ID Application: Relux Works, LLC (262RZ595FP)"
          export HARDENED=1
          bash scripts/build-app.sh
          mkdir -p dist dmg-root
          cp -R .temp/build/Pulsar.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Pulsar" -srcfolder dmg-root -ov -format UDZO "dist/Pulsar-${GITHUB_REF_NAME}-arm64.dmg"
          shasum -a 256 dist/*.dmg > dist/SHA256SUMS.pulsar
      - name: Sign the dmg container
        run: |
          codesign --force --sign "Developer ID Application: Relux Works, LLC (262RZ595FP)" --timestamp dist/Pulsar-*.dmg
      - name: Notarize + staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "$ASC_KEY_P8" | base64 -d > /tmp/asc.p8
          xcrun notarytool submit dist/Pulsar-*.dmg --key /tmp/asc.p8 \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          rm /tmp/asc.p8
          xcrun stapler staple dist/Pulsar-*.dmg
          spctl -a -t open --context context:primary-signature -v dist/Pulsar-*.dmg || true
      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          GEN=$(find node-app/.build/artifacts -name generate_appcast -type f | head -1)
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/ed_key
          "$GEN" --ed-key-file /tmp/ed_key -o dist/appcast.xml dist/
          rm -f /tmp/ed_key
          grep -c "<item>" dist/appcast.xml
      - name: Attest dmg provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Pulsar-*.dmg
      - name: Upload dmg to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  pulsar-win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pulsar-win/go.mod
      - name: Tests (portable, audio stub)
        run: cd pulsar-win && go test ./...
      - name: Generate Windows resources (icon + DPI manifest)
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          cd pulsar-win && "$(go env GOPATH)/bin/go-winres" make --in winres/winres.json --arch amd64 --product-version "${GITHUB_REF_NAME}"
      - name: Reproducible Windows build (CGO off)
        run: |
          mkdir -p dist
          cd pulsar-win
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath \
            -ldflags="-s -w -buildid= -X main.version=${GITHUB_REF_NAME}" \
            -o ../dist/pulsar-win-amd64.exe .
          cd ../dist && sha256sum pulsar-win-amd64.exe > SHA256SUMS.pulsar-win
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/pulsar-win-amd64.exe
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  msix:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: relux-works/go-librespot
          path: fork
      - uses: actions/setup-go@v5
        with:
          go-version-file: pulsar-win/go.mod
      - name: Build shell + fork daemon (reproducible, CGO off)
        shell: bash
        run: |
          mkdir -p stage/Assets
          go install github.com/tc-hib/go-winres@v0.3.3
          cd pulsar-win
          "$(go env GOPATH)/bin/go-winres" make --in winres/winres.json --arch amd64 --product-version "${GITHUB_REF_NAME}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -buildid= -X main.version=${GITHUB_REF_NAME}" -o ../stage/pulsar-win-amd64.exe .
          cd ../fork
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -buildid=" -o ../stage/go-librespot.exe ./cmd/daemon
      - name: Stage package (manifest + assets)
        shell: bash
        run: |
          cp pulsar-win/msix/Assets/*.png stage/Assets/
          # MSIX Version must be a numeric quad a.b.c.d.
          BASE=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^v//; s/-.*//')
          BUILD=$(echo "${GITHUB_REF_NAME}" | sed -E 's/.*\.([0-9]+)$/\1/; s/[^0-9]//g')
          [ -z "$BUILD" ] && BUILD=0
          sed "s/@VERSION@/${BASE}.${BUILD}/" pulsar-win/msix/AppxManifest.xml.in > stage/AppxManifest.xml
      # --- EV code signing (SSL.com eSigner) — activate when the cert issues ---
      # Path B: a direct-download .exe/.msix that runs without SmartScreen.
      # 1. gh secret set ESIGNER_USERNAME ESIGNER_PASSWORD ESIGNER_TOTP ESIGNER_CREDENTIAL_ID
      # 2. Update AppxManifest.xml.in Publisher to the EV cert's EXACT subject DN
      #    (MSIX requires Publisher == signing-cert subject).
      # 3. Uncomment the two signing steps below.
      # - name: Sign inner executables (EV)
      #   uses: sslcom/esigner-codesign@develop
      #   with:
      #     command: sign
      #     username: ${{ secrets.ESIGNER_USERNAME }}
      #     password: ${{ secrets.ESIGNER_PASSWORD }}
      #     totp_secret: ${{ secrets.ESIGNER_TOTP }}
      #     credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
      #     file_path: ${{ github.workspace }}/stage/pulsar-win-amd64.exe
      #     override: true
      - name: Pack MSIX (unsigned by CI — signed below when EV is configured)
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } | Sort-Object Name -Descending | Select-Object -First 1
          $makeappx = "$($sdk.FullName)\x64\makeappx.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $makeappx pack /d stage /p "dist/Pulsar-${env:GITHUB_REF_NAME}-win.msix" /o
      # - name: Sign MSIX (EV)
      #   uses: sslcom/esigner-codesign@develop
      #   with:
      #     command: sign
      #     username: ${{ secrets.ESIGNER_USERNAME }}
      #     password: ${{ secrets.ESIGNER_PASSWORD }}
      #     totp_secret: ${{ secrets.ESIGNER_TOTP }}
      #     credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
      #     file_path: ${{ github.workspace }}/dist/Pulsar-${{ github.ref_name }}-win.msix
      #     override: true
          (Get-FileHash "dist/Pulsar-${env:GITHUB_REF_NAME}-win.msix" -Algorithm SHA256).Hash | Out-File dist/SHA256SUMS.msix
      - name: Attest MSIX provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Pulsar-*-win.msix
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: coordinator/go.mod
      - name: Reproducible build (CGO off)
        run: |
          mkdir -p dist
          cd coordinator
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath \
              -ldflags="-s -w -buildid= -X main.version=${GITHUB_REF_NAME}" \
              -o ../dist/duet-coordinator-linux-$arch ./cmd/duet-coordinator
          done
          cd ../dist && shasum -a 256 * > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/duet-coordinator-*
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
