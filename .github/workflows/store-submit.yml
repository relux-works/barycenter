name: store-submit

# Manually push a released MSIX to the Microsoft Store via the msstore CLI
# (Store submission API). Deliberately workflow_dispatch — Store submission is
# an intentional act, never automatic on every beta tag.
#
# Prerequisites (one-time, see docs/decisions.md):
#   - Secrets: MSSTORE_TENANT_ID, MSSTORE_CLIENT_ID, MSSTORE_CLIENT_SECRET
#   - Repo variable STORE_SELLER_ID (Partner Center → Account settings → seller id)
#   - The pulsar-store-ci Azure AD app linked in Partner Center as Manager
#   - The Partner Center account fully verified (the red "not verified" banner gone)
#
# The exact `msstore` submission subcommand is finalized on the first real run
# against the verified account (blind until then); a failed manual run is
# harmless — it touches nothing but the pending Store submission.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose MSIX to submit (e.g. v0.3.0-beta.16)"
        required: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install msstore CLI (official self-contained binary)
        run: |
          curl -sL https://github.com/microsoft/msstore-cli/releases/latest/download/MSStoreCLI-linux-x64.tar.gz | tar xz
          chmod +x msstore
      - name: Download the MSIX from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pkg
          gh release download "${{ inputs.tag }}" --repo relux-works/barycenter \
            --pattern 'Pulsar-*-win.msix' --dir pkg
      - name: Configure credentials
        run: |
          ./msstore reconfigure \
            --tenantId "${{ secrets.MSSTORE_TENANT_ID }}" \
            --clientId "${{ secrets.MSSTORE_CLIENT_ID }}" \
            --clientSecret "${{ secrets.MSSTORE_CLIENT_SECRET }}" \
            --sellerId "${{ vars.STORE_SELLER_ID }}"
      - name: Submit the package to product 9P26FDCWV1GC
        run: |
          # msstore publish uploads the package to the reserved product and
          # creates/updates the pending submission. Finalized on first real run.
          ./msstore publish pkg/Pulsar-*-win.msix --id 9P26FDCWV1GC
