# Baked into the Barycenter docker image (v2). Everything sensitive or
# per-install comes from env — see deploy/coolify.env.example.
listen: "0.0.0.0:8080"          # behind the reverse proxy (TLS terminates there)
log_level: info                 # debug|info|warn|error — DUET_LOG_LEVEL overrides
db_path: /var/lib/duet/duet.db
media_dir: /var/lib/duet/media
# DUET_SELF_SERVICE_ONBOARDING is intentionally environment-only until the
# pinned predecessor is retired; that version rejects unknown YAML fields.
nodes:
  a: { token: "" }              # DUET_NODE_A_TOKEN
  b: { token: "" }              # DUET_NODE_B_TOKEN
telegram:
  bot_token: ""                 # DUET_TELEGRAM_BOT_TOKEN
  chat_id: 0                    # DUET_TELEGRAM_CHAT_ID
timings:
  ready_timeout_s: 8
  start_margin_extra_ms: 500
  offline_after_s: 12
  near_end_ms: 400
media:
  max_voice_s: 180
  retention_days: 7
  preset: default
