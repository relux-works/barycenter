name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  pulsar-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: relux-works/go-librespot
          path: fork
      - uses: actions/setup-go@v5
        with:
          go-version-file: fork/go.mod
      - name: Build daemon (fork, reproducible, arm64)
        run: |
          cd fork
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -buildid=" -o ../daemon-arm64 ./cmd/daemon
      # arm64-only for the beta: SwiftPM dual-arch manifests misbehave on
      # runners (given [5], supported []); universal ships later via xcodebuild.
      - name: Build Pulsar (arm64)
        run: |
          cd node-app
          swift build -c release
      - name: Bundle Pulsar.app + dmg
        run: |
          export VERSION="${GITHUB_REF_NAME}"
          export NODEAPP_BIN="$PWD/node-app/.build/release/NodeApp"
          export LIBRESPOT_BIN="$PWD/daemon-arm64"
          export APP_NAME=Pulsar
          bash scripts/build-app.sh
          mkdir -p dist dmg-root
          cp -R .temp/build/Pulsar.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Pulsar" -srcfolder dmg-root -ov -format UDZO "dist/Pulsar-${GITHUB_REF_NAME}-arm64.dmg"
          shasum -a 256 dist/*.dmg > dist/SHA256SUMS.pulsar
      - name: Attest dmg provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Pulsar-*.dmg
      - name: Upload dmg to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: coordinator/go.mod
      - name: Reproducible build (CGO off)
        run: |
          mkdir -p dist
          cd coordinator
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath \
              -ldflags="-s -w -buildid= -X main.version=${GITHUB_REF_NAME}" \
              -o ../dist/duet-coordinator-linux-$arch ./cmd/duet-coordinator
          done
          cd ../dist && shasum -a 256 * > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/duet-coordinator-*
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
